version: '3.8'

services:
  db-vidasalud:
    image: postgres:15
    container_name: postgres-vidasalud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: vidasalud
    ports:
      - "5432:5432"
    volumes:
      - pgdata-vidasalud:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-vidasalud
    ports:
      - "5672:5672"
      - "15672:15672" # Panel de administración HTTP
    restart: unless-stopped



volumes:
  pgdata-vidasalud:
