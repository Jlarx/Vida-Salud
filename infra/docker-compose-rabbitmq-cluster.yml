version: '3.8'

services:
  db-vidasalud:
    image: postgres:15
    container_name: postgres-vidasalud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: vidasalud
    ports:
      - "5432:5432"
    volumes:
      - pgdata-vidasalud:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    restart: unless-stopped
    networks:
      - vidasalud-net

  rabbitmq-node1:
    image: rabbitmq:3-management
    container_name: rabbitmq-node1
    hostname: rabbitmq-node1
    environment:
      RABBITMQ_ERLANG_COOKIE: "VIDASALUD_CLUSTER_SECRET_12345"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_node1_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - vidasalud-net

  rabbitmq-node2:
    image: rabbitmq:3-management
    container_name: rabbitmq-node2
    hostname: rabbitmq-node2
    environment:
      RABBITMQ_ERLANG_COOKIE: "VIDASALUD_CLUSTER_SECRET_12345"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_node2_data:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-node1
    restart: unless-stopped
    networks:
      - vidasalud-net

networks:
  vidasalud-net:
    driver: bridge

volumes:
  pgdata-vidasalud:
  rabbitmq_node1_data:
  rabbitmq_node2_data:

