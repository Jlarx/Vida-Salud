server.port=8082
spring.application.name=ms-vidasalud-appointments

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vidasalud_appointments
spring.datasource.username=postgres
spring.datasource.password=123456789

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Azure Entra ID - JWT Validation
# Azure Entra ID - JWT Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/001834fd-b68a-4e6a-a718-6d859787b926/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://09d40f2a-29ea-43c0-8d74-b89ba284c778,09d40f2a-29ea-43c0-8d74-b89ba284c778

logging.level.org.springframework.security=TRACE

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Custom Properties (Centralized Names)
rabbitmq.exchange.audit=audit.exchange
rabbitmq.queue.audit=audit.queue
rabbitmq.routing.key.audit=audit.routing.key

rabbitmq.exchange.notify=notify.exchange
rabbitmq.queue.notify=notify.queue
rabbitmq.routing.key.notify=notify.routing.key

rabbitmq.dlx=deadLetterExchange
rabbitmq.dlq.audit=audit.dlq
rabbitmq.dlq.notify=notify.dlq
rabbitmq.routing.key.dlq=dlq.routing.key